plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
}

// Local Hytale installation, only used by the IDEA run configuration to find
// the game assets. Override it with -Phytale_home=... or in
// ~/.gradle/gradle.properties when the launcher is not installed in the
// default Windows location.
def hytaleHome = findProperty('hytale_home') ?: "${System.getProperty('user.home')}/AppData/Roaming/Hytale"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    maven {
        name = 'Hytale'
        url = "https://maven.hytale.com/$patchline"
    }
}

// Compiles against the Hytale server published on the official Maven
// repository, so no local game installation is needed to build.
dependencies {
    implementation "com.hypixel.hytale:Server:$hytale_version"
}

// Create the working directory to run the server if it does not already exist.
def serverRunDir = file("$projectDir/run")
if (!serverRunDir.exists()) {
    serverRunDir.mkdirs()
}

// Fills the plugin manifest with the properties defined in gradle.properties.
// The source manifest.json is a template and is never modified by the build.
tasks.named('processResources') {
    def manifestProperties = [
            version       : version,
            server_version: server_version,
            includes_pack : includes_pack.toBoolean(),
    ]
    inputs.properties(manifestProperties)
    filteringCharset = 'UTF-8'
    filesMatching('manifest.json') {
        expand(manifestProperties)
    }
}

// Creates a run configuration in IDEA that will run the Hytale server with
// your plugin and the default assets.
idea.project.settings.runConfigurations {
    'HytaleServer'(org.jetbrains.gradle.ext.Application) {
        mainClass = 'com.hypixel.hytale.Main'
        moduleName = project.idea.module.name + '.main'
        programParameters = "--allow-op --assets=$hytaleHome/install/$patchline/package/game/latest/Assets.zip"
        if (includes_pack.toBoolean()) {
            programParameters += " --mods=${sourceSets.main.java.srcDirs.first().parentFile.absolutePath}"
        }
        if (load_user_mods.toBoolean()) {
            programParameters += " --mods=$hytaleHome/UserData/Mods"
        }
        workingDirectory = serverRunDir.absolutePath
    }
}